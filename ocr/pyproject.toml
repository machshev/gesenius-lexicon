[project]
name = "gesenius-ocr"
version = "0.1.0"
description = "Pinned non-Rust OCR subprocess environment for gesenius-lexicon"
requires-python = ">=3.12,<3.14"
dependencies = [
  "kraken==7.1",
  "torch==2.10.0",
  "torchvision==0.25.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = false
